[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlascore"
version = "0.1.0"
description = "From-scratch multi-agent core for Atlas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "openai>=1.107.0",
    "typing-extensions>=4.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
]
rag = [
    "qdrant-client>=1.9.0",
    "sentence-transformers>=2.2.0",
]
computer-use = [
    "playwright>=1.40.0",
    "pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2020.1.16",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
    "pyright>=1.1.350",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlascore"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services (slow)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
include = ["src", "backend"]
exclude = ["**/__pycache__", "src/atlascore/memory/_qdrant.py", "src/atlascore/middleware/_otel.py"]
typeCheckingMode = "standard"
pythonVersion = "3.10"
reportMissingTypeStubs = false
